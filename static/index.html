<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI PDF Chat</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 720px;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #111;
      }
      .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 24px;
      }
      .card {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .upload-zone {
        border: 2px dashed #d0d0d0;
        border-radius: 10px;
        padding: 32px 20px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .upload-zone:hover {
        border-color: #3b82f6;
      }
      .upload-zone.dragover {
        border-color: #3b82f6;
        background: #f0f6ff;
      }
      .upload-zone p {
        margin: 0;
        color: #666;
        font-size: 14px;
      }
      .file-status {
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #111;
      }
      .file-status.active {
        display: flex;
      }
      .badge {
        background: #e6f4ea;
        color: #1a7f37;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 20px;
      }
      #chat {
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      #chat.active {
        display: flex;
      }
      .messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .msg {
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        max-width: 85%;
      }
      .msg.user {
        background: #3b82f6;
        color: white;
        align-self: flex-end;
      }
      .msg.bot {
        background: #f1f1f3;
        color: #111;
        align-self: flex-start;
      }
      .sources {
        margin-top: 8px;
        font-size: 12px;
        color: #888;
      }
      .sources summary {
        cursor: pointer;
      }
      .source-chunk {
        background: #fafafa;
        border-left: 2px solid #ddd;
        padding: 6px 10px;
        margin-top: 4px;
        font-size: 12px;
        color: #555;
      }
      .input-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #3b82f6;
      }
      button {
        background: #111;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .loading {
        font-size: 13px;
        color: #888;
        align-self: flex-start;
      }
      #fileInput {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AI PDF Chat</h1>
      <p class="subtitle">
        Upload a PDF and ask questions about it — answers are grounded in the
        document with sources.
      </p>

      <div class="card">
        <div id="uploadZone" class="upload-zone">
          <p>Click or drag a PDF here to upload</p>
          <input type="file" id="fileInput" accept="application/pdf" />
        </div>
        <div id="fileStatus" class="file-status">
          <span class="badge">Ready</span>
          <span id="fileName"></span>
        </div>
      </div>

      <div id="chat" class="card">
        <div id="messages" class="messages"></div>
        <div class="input-row">
          <input
            type="text"
            id="questionInput"
            placeholder="Ask a question about the document..."
          />
          <button id="sendBtn">Ask</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;

      const uploadZone = document.getElementById("uploadZone");
      const fileInput = document.getElementById("fileInput");
      const fileStatus = document.getElementById("fileStatus");
      const fileName = document.getElementById("fileName");
      const chat = document.getElementById("chat");
      const messages = document.getElementById("messages");
      const questionInput = document.getElementById("questionInput");
      const sendBtn = document.getElementById("sendBtn");

      let sessionId = null;

      uploadZone.addEventListener("click", () => fileInput.click());

      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("dragover");
      });
      uploadZone.addEventListener("dragleave", () => {
        uploadZone.classList.remove("dragover");
      });
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          handleUpload(e.dataTransfer.files[0]);
        }
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          handleUpload(fileInput.files[0]);
        }
      });

      async function handleUpload(file) {
        if (file.type !== "application/pdf") {
          alert("Please upload a PDF file.");
          return;
        }

        uploadZone.innerHTML = "<p>Processing PDF...</p>";

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`${API_URL}/upload`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) throw new Error("Upload failed");

          const data = await res.json();
          sessionId = data.session_id;

          fileStatus.classList.add("active");
          fileName.textContent = `${data.filename} · ${data.chunks} chunks indexed`;
          uploadZone.style.display = "none";

          chat.classList.add("active");
          addMessage(
            "bot",
            `Your document is ready. Ask me anything about "${data.filename}".`,
          );
        } catch (err) {
          uploadZone.innerHTML = "<p>Upload failed — click to try again</p>";
        }
      }

      function addMessage(role, text, sources) {
        const msg = document.createElement("div");
        msg.className = `msg ${role}`;
        msg.textContent = text;

        if (sources && sources.length) {
          const details = document.createElement("details");
          details.className = "sources";
          const summary = document.createElement("summary");
          summary.textContent = `${sources.length} source chunk${sources.length > 1 ? "s" : ""}`;
          details.appendChild(summary);

          sources.forEach((s) => {
            const chunk = document.createElement("div");
            chunk.className = "source-chunk";
            chunk.textContent = s;
            details.appendChild(chunk);
          });

          msg.appendChild(details);
        }

        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || !sessionId) return;

        addMessage("user", question);
        questionInput.value = "";
        sendBtn.disabled = true;

        const loading = document.createElement("div");
        loading.className = "loading";
        loading.textContent = "Thinking...";
        messages.appendChild(loading);
        messages.scrollTop = messages.scrollHeight;

        try {
          const res = await fetch(`${API_URL}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, question }),
          });

          const data = await res.json();
          loading.remove();

          if (!res.ok) {
            addMessage(
              "bot",
              "Something went wrong answering that. Try again.",
            );
          } else {
            addMessage("bot", data.answer, data.sources);
          }
        } catch (err) {
          loading.remove();
          addMessage("bot", "Couldn't reach the server.");
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", sendQuestion);
      questionInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendQuestion();
      });
    </script>
  </body>
</html>
